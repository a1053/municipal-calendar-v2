name: Actualizar calendario de Municipal

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (hora UTC)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - "scripts/**"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests

      - name: Regenerar municipal.ics desde ESPN
        run: python scripts/update_calendar.py

      - name: Publicar cambios (solo si los hay)
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data/matches.json municipal.ics
          if git diff --cached --quiet; then
            echo "Sin cambios en el calendario."
          else
            git commit -m "chore: actualizar calendario de Municipal"
            git push
          fi
