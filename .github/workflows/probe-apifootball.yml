name: Probar fuentes
on:
  push:
    branches: [probe-apifootball]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 scripts/tigo_probe.py
