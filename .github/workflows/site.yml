name: Publicar sitio de Municipal

on:
  schedule:
    - cron: "*/15 * * * *"    # cada 15 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:           # botón "Run workflow"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests

      - uses: actions/configure-pages@v5

      - name: Bajar los datos ya publicados (respaldo si ESPN falla)
        run: |
          mkdir -p _prev
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for f in standings news; do
            curl -fsS --max-time 20 "$base/$f.json" -o "_prev/$f.json" || rm -f "_prev/$f.json"
          done
          ls _prev

      - name: Generar sitio con datos de ESPN
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp municipal.ics _site/municipal.ics
          python scripts/build_site_data.py --out _site/data --previous _prev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
